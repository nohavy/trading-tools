[project]
name = "tradingv2"
version = "0.1.0"
description = "Microtrading crypto (Binance spot + futures USDⓈ-M) : backtest réaliste, puis paper et live"
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.8",
    "polars>=1.0",
    "pyarrow>=18",
    "numpy>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
tv2 = "tradingv2.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingv2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "net: tests requiring network access (deselect with -m 'not net')",
    "slow: long-running benchmarks (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tradingv2", "tests"]

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true